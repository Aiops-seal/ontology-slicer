[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-slicer"
version = "1.0.0"
description = "本体切片器：把一份完整本体切一块给模型看，判断归本体，不归代码"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aiops-seal" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ontology-slicer = "ontology_slicer.__main__:main"

[tool.setuptools]
packages = ["ontology_slicer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
